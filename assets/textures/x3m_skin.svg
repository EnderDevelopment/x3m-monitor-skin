<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
    <!-- Head -->
    <rect x="0" y="0" width="16" height="16" fill="#808080" />
    <rect x="1" y="1" width="14" height="14" fill="#000000" />
    <rect x="2" y="2" width="12" height="12" fill="#808080" />
    <rect x="3" y="3" width="10" height="10" fill="#000000" />
    <rect x="4" y="4" width="8" height="8" fill="#808080" />
    <rect x="5" y="5" width="6" height="6" fill="#000000" />
    <rect x="6" y="6" width="4" height="4" fill="#808080" />
    <rect x="7" y="7" width="2" height="2" fill="#000000" />
    
    <!-- Eyes -->
    <rect x="6" y="6" width="1" height="1" fill="#FFFFFF" />
    <rect x="9" y="6" width="1" height="1" fill="#FFFFFF" />
    <rect x="8" y="7" width="1" height="1" fill="#FFFFFF" />
    <rect x="9" y="6" width="1" height="1" fill="#FFFFFF" />
    <rect x="8" y="7" width="1" height="1" fill="#FFFFFF" />
    
    <!-- Body -->
    <rect x="16" y="16" width="8" height="12" fill="#000000" />
    <rect x="17" y="17" width="6" height="10" fill="#808080" />
    <rect x="18" y="18" width="4" height="8" fill="#000000" />
    
    <!-- Arms -->
    <rect x="0" y="16" width="4" height="12" fill="#000000" />
    <rect x="1" y="17" width="2" height="10" fill="#808080" />
    <rect x="4" y="16" width="4" height="12" fill="#000000" />
    <rect x="5" y="17" width="2" height="10" fill="#808080" />
    
    <!-- Legs -->
    <rect x="4" y="32" width="4" height="12" fill="#000000" />
    <rect x="5" y="33" width="2" height="10" fill="#808080" />
    <rect x="8" y="32" width="4" height="12" fill="#000000" />
    <rect x="9" y="33" width="2" height="10" fill="#808080" />
    
    <!-- Overlay -->
    <rect x="0" y="0" width="16" height="16" fill="#808080" opacity="0.5" />
    <rect x="16" y="16" width="8" height="12" fill="#808080" opacity="0.5" />
    <rect x="0" y="16" width="4" height="12" fill="#808080" opacity="0.5" />
    <rect x="4" y="16" width="4" height="12" fill="#808080" opacity="0.5" />
    <rect x="4" y="32" width="4" height="12" fill="#808080" opacity="0.5" />
    <rect x="8" y="32" width="4" height="12" fill="#808080" opacity="0.5" />
</svg>